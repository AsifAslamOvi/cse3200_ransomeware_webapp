services:
  - type: web
    name: ransomware-webapp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app
    # Free tier does not support persistent disks. Quarantine uploads will be ephemeral
    # (lost on redeploy/restart). Upgrade plan and re-add a disk if persistence is required.
